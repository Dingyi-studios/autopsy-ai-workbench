name: AI triage checks
on:
  push:
    paths:
      - 'Tools/autopsy-ai-triage/**'
      - '.github/workflows/ai-triage.yml'
  pull_request:
    paths:
      - 'Tools/autopsy-ai-triage/**'
      - '.github/workflows/ai-triage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Tools/autopsy-ai-triage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run demo
